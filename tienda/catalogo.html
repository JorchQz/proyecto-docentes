<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Catálogo de planeaciones · Jissez</title>
	<meta name="description" content="Explora planeaciones para primaria por grado o modalidad multigrado, alineadas a la Nueva Escuela Mexicana.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="js/tienda-theme.js"></script>
	<script src="https://unpkg.com/lucide@latest"></script>
	<link rel="stylesheet" href="css/tienda.css">

<body class="antialiased min-h-screen">

<!-- Encabezado de página -->
<div class="border-b border-line bg-white">
	<div class="max-w-content mx-auto px-4 sm:px-6 py-8 lg:py-10">
		<div class="flex flex-wrap items-end justify-between gap-4">
			<div>
				<div class="flex items-center gap-2 text-[13px] text-mute mb-2">
					<a href="index.html" class="hover:text-ink transition">Inicio</a>
					<i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
					<span class="text-ink font-medium">Catálogo</span>
				</div>
				<h1 class="font-black text-ink text-[clamp(1.8rem,3.5vw,2.6rem)] tracking-tight leading-tight">Catálogo de planeaciones</h1>
				<p id="subtituloCatalogo" class="mt-2 text-mute">Elige tu grado o modalidad. Seleccionas T1, T2, T3 o ciclo completo en la página del paquete.</p>
				<!-- Rojo: color del descuento en toda la tienda (Tienda.COLOR_DESCUENTO) -->
				<div id="tiraPromo" class="hidden mt-3 inline-flex items-center gap-2 h-9 px-3.5 rounded-xl text-[13px] font-semibold border" style="background:rgba(220,38,38,.08);color:#b91c1c;border-color:rgba(220,38,38,.25)"></div>
			</div>
			<p class="text-[14px] text-mute"><span id="contadorTexto"></span></p>
		</div>
	</div>
</div>

<main class="max-w-content mx-auto px-4 sm:px-6 py-8">

	<!-- Filtros. Pegajosos solo desde tablet: en un teléfono la caja llega a
	     ocupar tres filas de chips y se comía casi la mitad de la pantalla. -->
	<div class="bg-white border border-line rounded-2xl shadow-sm p-4 mb-6 md:sticky md:top-16 z-20 flex flex-col gap-4">
		<!-- Qué se compra: el paquete de un grado (trimestre o ciclo) o UN proyecto
		     suelto. Son productos distintos con precios distintos; mezclarlos en la
		     misma tarjeta haría que el "desde" del grado bajara al del proyecto. -->
		<div>
			<p class="text-[11px] font-bold uppercase tracking-[0.12em] text-mute mb-2">Qué buscas</p>
			<div id="chipsVista" class="flex flex-wrap gap-2">
				<button data-vista="paquetes" class="chip-vista chip active border text-sm font-semibold h-10 px-4 rounded-xl">Paquetes completos</button>
				<button data-vista="proyectos" class="chip-vista chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">Proyectos individuales</button>
			</div>
		</div>
		<div>
			<p class="text-[11px] font-bold uppercase tracking-[0.12em] text-mute mb-2">Organización</p>
			<div id="chipsOrg" class="flex flex-wrap gap-2">
				<button data-org="completa" class="chip-org chip active border text-sm font-semibold h-10 px-4 rounded-xl">Organización completa</button>
				<button data-org="multigrado" class="chip-org chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">Multigrado</button>
			</div>
		</div>
		<div id="subCompleta">
			<p class="text-[11px] font-bold uppercase tracking-[0.12em] text-mute mb-2">Grado</p>
			<div id="chipsGrado" class="flex flex-wrap gap-2">
				<button data-grado="1" class="chip-grado chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">1°</button>
				<button data-grado="2" class="chip-grado chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">2°</button>
				<button data-grado="3" class="chip-grado chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">3°</button>
				<button data-grado="4" class="chip-grado chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">4°</button>
				<button data-grado="5" class="chip-grado chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">5°</button>
				<button data-grado="6" class="chip-grado chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">6°</button>
			</div>
		</div>
		<div id="subMultigrado" class="hidden flex flex-col gap-4">
			<div>
				<p class="text-[11px] font-bold uppercase tracking-[0.12em] text-mute mb-2">Modalidad</p>
				<!-- Sin la lista de combinaciones en la etiqueta: ocupaba dos
				     líneas en el celular y ahora se eligen abajo. -->
				<div id="chipsModalidad" class="flex flex-wrap gap-2">
					<button data-mod="tridocente" class="chip-mod chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">Tridocente</button>
					<button data-mod="bidocente" class="chip-mod chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">Bidocente</button>
					<button data-mod="unitaria" class="chip-mod chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl">Unitaria</button>
				</div>
			</div>
			<!-- Combinaciones concretas. Se generan desde los paquetes reales
			     para no listar combos que no existen. -->
			<div id="bloqueCombos">
				<p class="text-[11px] font-bold uppercase tracking-[0.12em] text-mute mb-2">Grados que atiendes</p>
				<div id="chipsCombo" class="flex flex-wrap gap-2"></div>
			</div>
		</div>

		<!-- Filtro curricular: solo en la vista de proyectos. Campos, contenidos y
		     PDAs de selección múltiple; contenidos y PDAs con buscador de texto
		     (Tienda.combobox), y solo aparece lo que cubre algún proyecto
		     publicado. Elegir un PDA agrega su contenido. -->
		<div id="subProyectos" class="hidden flex-col gap-4">
			<div>
				<p class="text-[11px] font-bold uppercase tracking-[0.12em] text-mute mb-2">Campos formativos <span class="normal-case tracking-normal font-semibold">· varios</span></p>
				<div id="chipsCF" class="flex flex-wrap gap-2">
					<button data-cf="LEN" class="chip-cf chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl inline-flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background:#059669"></span>Lenguajes</button>
					<button data-cf="SAB" class="chip-cf chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl inline-flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background:#ea580c"></span>Saberes y Pensamiento Científico</button>
					<button data-cf="ETI" class="chip-cf chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl inline-flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background:#7c3aed"></span>Ética, Naturaleza y Sociedades</button>
					<button data-cf="DHL" class="chip-cf chip border border-line text-ink bg-white text-sm font-semibold h-10 px-4 rounded-xl inline-flex items-center gap-2"><span class="w-2 h-2 rounded-full" style="background:#0284c7"></span>De lo Humano y lo Comunitario</button>
				</div>
			</div>
			<!-- Mismo buscador de selección múltiple que el formulario a la medida
			     (Tienda.combobox). Solo lista lo que cubre algún proyecto publicado. -->
			<div class="grid gap-3 sm:grid-cols-2">
				<div>
					<label for="filtroContenido" class="block text-[11px] font-bold uppercase tracking-[0.12em] text-mute mb-2">Contenidos <span class="normal-case tracking-normal font-semibold">· varios</span></label>
					<div id="chipsContenidos" class="flex flex-wrap gap-1.5 mb-2 empty:hidden"></div>
					<div class="relative">
						<input id="filtroContenido" type="text" autocomplete="off" placeholder="Escribe para buscar un contenido"
							class="w-full h-11 pl-3.5 pr-10 border border-line rounded-xl text-sm" style="color:#1c2434;background:#fff">
						<i data-lucide="search" class="w-4 h-4 absolute right-3.5 top-1/2 -translate-y-1/2 text-mute pointer-events-none"></i>
					</div>
					<div id="listaContenidos" class="hidden mt-1 max-h-64 overflow-y-auto bg-white border border-line rounded-xl shadow-lg"></div>
				</div>
				<div>
					<label for="filtroPda" class="block text-[11px] font-bold uppercase tracking-[0.12em] text-mute mb-2">PDA <span class="normal-case tracking-normal font-semibold">· varios</span></label>
					<div id="chipsPdas" class="flex flex-wrap gap-1.5 mb-2 empty:hidden"></div>
					<div class="relative">
						<input id="filtroPda" type="text" autocomplete="off" placeholder="Escribe para buscar un PDA"
							class="w-full h-11 pl-3.5 pr-10 border border-line rounded-xl text-sm" style="color:#1c2434;background:#fff">
						<i data-lucide="search" class="w-4 h-4 absolute right-3.5 top-1/2 -translate-y-1/2 text-mute pointer-events-none"></i>
					</div>
					<div id="listaPdas" class="hidden mt-1 max-h-64 overflow-y-auto bg-white border border-line rounded-xl shadow-lg"></div>
				</div>
			</div>
		</div>
	</div>

	<!-- Aplica ?org= y ?vista= ANTES del primer pintado. Si se deja para
	     catalogo.js, la caja se dibuja en su estado por defecto y salta a la
	     vista, con su cambio de altura. catalogo.js lo repite sin efecto. -->
	<script>
		(function () {
			var q = new URLSearchParams(location.search);
			function marcar(selector, attr, valor) {
				var chips = document.querySelectorAll(selector);
				for (var i = 0; i < chips.length; i++) {
					var activo = chips[i].getAttribute(attr) === valor;
					chips[i].classList.toggle("active", activo);
					chips[i].classList.toggle("border-line", !activo);
					chips[i].classList.toggle("text-ink", !activo);
				}
			}
			if (q.get("org") === "multigrado") {
				marcar("#chipsOrg .chip-org", "data-org", "multigrado");
				document.getElementById("subCompleta").classList.add("hidden");
				var multi = document.getElementById("subMultigrado");
				multi.classList.remove("hidden");
				multi.classList.add("flex");
			}
			if (q.get("vista") === "proyectos") {
				marcar("#chipsVista .chip-vista", "data-vista", "proyectos");
				var sp = document.getElementById("subProyectos");
				sp.classList.remove("hidden");
				sp.classList.add("flex");
			}
		})();
	</script>

	<!-- Estado / grid -->
	<div id="estado" class="text-center py-20 text-mute"></div>
	<div id="grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<!-- Único lugar del mapeo nombre largo ↔ código corto de campo formativo. -->
<script src="../js/campos-formativos.js"></script>
<script src="js/tienda-common.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
