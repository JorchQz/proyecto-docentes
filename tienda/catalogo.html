<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Catálogo de Planeaciones NEM</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-gray-50 min-h-screen pt-14 text-gray-800">

	<div class="max-w-6xl mx-auto px-4 py-6 flex flex-col gap-6">

		<header class="flex flex-col gap-1">
			<h1 class="text-2xl md:text-3xl font-extrabold text-blue-900">Catálogo de planeaciones</h1>
			<p class="text-gray-500 text-sm" id="contadorTexto">Cargando...</p>
		</header>

		<!-- Filtros -->
		<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 flex flex-col gap-4 sticky top-16 z-20">
			<div>
				<p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Organización</p>
				<div id="chipsOrg" class="flex flex-wrap gap-2">
					<button data-org="completa" class="chip-org border border-emerald-600 text-white bg-emerald-600 text-sm font-semibold px-4 py-2 rounded-xl transition min-h-[44px]">Organización completa</button>
					<button data-org="multigrado" class="chip-org border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 text-sm font-semibold px-4 py-2 rounded-xl transition min-h-[44px]">Multigrado</button>
				</div>
			</div>

			<!-- Subfiltro: completa → grados -->
			<div id="subCompleta">
				<p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Grado</p>
				<div id="chipsGrado" class="flex flex-wrap gap-2">
					<button data-grado="1" class="chip-grado border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 text-sm font-semibold px-4 py-2 rounded-xl transition min-h-[44px]">1°</button>
					<button data-grado="2" class="chip-grado border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 text-sm font-semibold px-4 py-2 rounded-xl transition min-h-[44px]">2°</button>
					<button data-grado="3" class="chip-grado border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 text-sm font-semibold px-4 py-2 rounded-xl transition min-h-[44px]">3°</button>
					<button data-grado="4" class="chip-grado border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 text-sm font-semibold px-4 py-2 rounded-xl transition min-h-[44px]">4°</button>
					<button data-grado="5" class="chip-grado border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 text-sm font-semibold px-4 py-2 rounded-xl transition min-h-[44px]">5°</button>
					<button data-grado="6" class="chip-grado border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 text-sm font-semibold px-4 py-2 rounded-xl transition min-h-[44px]">6°</button>
				</div>
			</div>

			<!-- Subfiltro: multigrado → modalidad -->
			<div id="subMultigrado" class="hidden">
				<p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Modalidad</p>
				<div id="chipsModalidad" class="flex flex-wrap gap-2">
					<button data-mod="tridocente" class="chip-mod border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 text-sm font-semibold px-4 py-2 rounded-xl transition min-h-[44px]">Tridocente · 1°-2° · 3°-4° · 5°-6°</button>
					<button data-mod="bidocente" class="chip-mod border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 text-sm font-semibold px-4 py-2 rounded-xl transition min-h-[44px]">Bidocente · 1°-2°-3° · 4°-5°-6°</button>
				</div>
			</div>
		</div>

		<!-- Estado / grid -->
		<div id="estado" class="text-center py-16"></div>
		<div id="grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

	</div>

	<script src="https://unpkg.com/lucide@latest"></script>
	<script src="../js/supabase.js"></script>
	<script src="js/tienda-common.js"></script>
	<script src="js/catalogo.js"></script>
</body>
</html>
