<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mis compras — Planeaciones NEM</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-gray-50 min-h-screen pt-14 text-gray-800">

	<div class="max-w-4xl mx-auto px-4 py-6 flex flex-col gap-6">

		<header>
			<h1 class="text-2xl md:text-3xl font-extrabold text-blue-900">Mis compras</h1>
			<p class="text-gray-500 text-sm mt-1">Descarga tus planeaciones cuando quieras.</p>
		</header>

		<div id="banner"></div>

		<div id="estado" class="text-center py-16 text-gray-400">Cargando...</div>

		<!-- Compras activas -->
		<div id="listaCompras" class="hidden flex flex-col gap-4"></div>

		<!-- Pedidos pendientes -->
		<div id="seccionPendientes" class="hidden flex flex-col gap-3">
			<h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">En proceso</h2>
			<div id="listaPendientes" class="flex flex-col gap-3"></div>
		</div>
	</div>

	<script src="https://unpkg.com/lucide@latest"></script>
	<script src="../js/supabase.js"></script>
	<script src="js/tienda-common.js"></script>
	<script src="js/mis-compras.js"></script>
</body>
</html>
