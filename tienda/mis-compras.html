<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mis compras — Jissez</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/lucide@latest"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						board: { DEFAULT: '#1e3a8a', deep: '#16276b' },
						ink: '#1c2434', mute: '#5b6473', line: '#e7e6df',
						action: { DEFAULT: '#059669', dark: '#047a55' },
						paper: '#faf9f4',
						gisAmarillo: '#f2cf6b',
					},
					fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
					maxWidth: { content: '1180px' },
				},
			},
		};
	</script>
	<style>
		body { font-family: 'Inter', system-ui, sans-serif; background: #faf9f4; color: #1c2434; -webkit-font-smoothing: antialiased; }
	</style>
</head>
<body class="antialiased min-h-screen">

<!-- Encabezado de página -->
<div class="border-b border-line bg-white">
	<div class="max-w-content mx-auto px-4 sm:px-6 py-8">
		<h1 class="font-black text-ink text-[clamp(1.8rem,3.5vw,2.6rem)] tracking-tight">Mis compras</h1>
		<p class="mt-1 text-mute">Descarga tus planeaciones cuando quieras, sin caducidad.</p>
	</div>
</div>

<main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 flex flex-col gap-6">

	<div id="banner"></div>
	<div id="estado" class="text-center py-20" style="color:#5b6473">Cargando...</div>

	<!-- Compras activas -->
	<div id="listaCompras" class="hidden flex flex-col gap-4"></div>

	<!-- Pedidos pendientes -->
	<div id="seccionPendientes" class="hidden flex flex-col gap-3">
		<h2 class="text-[11px] font-bold uppercase tracking-[0.12em] text-mute">En proceso</h2>
		<div id="listaPendientes" class="flex flex-col gap-3"></div>
	</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="js/tienda-common.js"></script>
<script src="js/mis-compras.js"></script>
</body>
</html>
