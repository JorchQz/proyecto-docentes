    <script src="https://cdn.tailwindcss.com"></script>

<body class="flex items-center justify-center min-h-screen p-4" style="background:#faf9f4;color:#1c2434">

    <div class="bg-white p-8 rounded-3xl shadow-sm w-full max-w-md" style="border:1px solid #e7e6df">
        <div class="text-center mb-8">
            <img src="tienda/assets/jissez-wordmark-blue.png" alt="Jissez"
                 style="height:30px;width:auto;margin:0 auto 16px"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
            <h1 style="display:none;color:#1e3a8a;font-size:26px;font-weight:800;margin-bottom:16px">Jissez</h1>
            <h2 class="text-xl font-bold" style="color:#1c2434">Crea una contraseña nueva</h2>
            <p class="mt-1 text-sm" style="color:#5b6473">Elige una que recuerdes: con ella entras a tus planeaciones.</p>
        </div>

        <form id="resetPasswordForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-800">Nueva contraseña</label>
                <input type="password" id="newPassword" required minlength="6" class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="••••••••">

                <div class="mt-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-gray-600">Fortaleza</span>
                        <span id="passwordStrengthLabel" class="text-xs font-medium text-gray-600">Sin evaluar</span>
                    </div>
                    <div class="mt-1 h-2 w-full bg-gray-200 rounded-full overflow-hidden">
                        <div id="passwordStrengthBar" class="h-full w-0 bg-gray-400 transition-all duration-300"></div>
                    </div>
                    <p id="passwordStrengthHint" class="text-xs text-gray-500 mt-2">
                        Recomendado: 8+ caracteres, mayúsculas, minúsculas, número y símbolo.
                    </p>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-800">Confirmar nueva contraseña</label>
                <input type="password" id="confirmPassword" required minlength="6" class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full h-12 flex justify-center items-center rounded-xl text-[15px] font-bold text-white transition" style="background:#059669">
                Guardar nueva contraseña
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500">
                ¿Ya la recordaste? <a href="tienda/login.html" class="font-semibold" style="color:#1e3a8a">Volver a iniciar sesión</a>
            </p>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth-mensajes.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
