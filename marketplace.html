<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Marketplace — Jissez</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Meta Pixel Code -->

</head>
<body class="bg-gray-50 min-h-screen pt-14 pb-24 text-gray-800">

	<!-- Header principal -->
	<header class="bg-blue-900">
		<div class="max-w-4xl mx-auto px-4 md:px-8 py-6">
			<h1 class="text-2xl md:text-3xl font-bold text-white leading-tight">Marketplace de Planeaciones</h1>
			<p class="text-blue-200 text-sm mt-1">Proyectos listos para usar en tu grupo</p>
		</div>
	</header>

	<!-- Filtros (sticky) -->
	<div id="filtrosBar" class="sticky top-14 z-20 bg-white shadow-sm border-b border-gray-100">
		<div class="max-w-4xl mx-auto px-4 md:px-8 py-3 flex flex-col gap-3">

			<!-- Chips de grado -->
			<div class="flex items-center gap-2 flex-wrap">
				<span class="text-xs font-semibold text-gray-500 uppercase tracking-wide mr-1">Grado</span>
				<div id="chipsGrado" class="flex items-center gap-1.5 flex-wrap">
					<button type="button" data-grado="1" class="chip-grado min-h-[40px] px-3.5 rounded-full text-sm font-semibold border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 transition">1°</button>
					<button type="button" data-grado="2" class="chip-grado min-h-[40px] px-3.5 rounded-full text-sm font-semibold border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 transition">2°</button>
					<button type="button" data-grado="3" class="chip-grado min-h-[40px] px-3.5 rounded-full text-sm font-semibold border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 transition">3°</button>
					<button type="button" data-grado="4" class="chip-grado min-h-[40px] px-3.5 rounded-full text-sm font-semibold border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 transition">4°</button>
					<button type="button" data-grado="5" class="chip-grado min-h-[40px] px-3.5 rounded-full text-sm font-semibold border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 transition">5°</button>
					<button type="button" data-grado="6" class="chip-grado min-h-[40px] px-3.5 rounded-full text-sm font-semibold border border-gray-300 text-gray-600 bg-white hover:bg-gray-50 transition">6°</button>
				</div>
			</div>

			<!-- Dropdowns -->
			<div class="flex items-center gap-2 flex-wrap">
				<div class="flex items-center gap-1.5">
					<label for="filtroCampo" class="text-xs font-semibold text-gray-500 uppercase tracking-wide whitespace-nowrap">Campo</label>
					<select id="filtroCampo" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-xl px-3 py-2 min-h-[40px] focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
						<option value="">Todos</option>
						<option value="Lenguajes">Lenguajes</option>
						<option value="Saberes y Pensamiento Científico">Saberes y Pensamiento Científico</option>
						<option value="Ética, Naturaleza y Sociedades">Ética, Naturaleza y Sociedades</option>
						<option value="De lo Humano y lo Comunitario">De lo Humano y lo Comunitario</option>
					</select>
				</div>
				<div class="flex items-center gap-1.5">
					<label for="filtroMetodologia" class="text-xs font-semibold text-gray-500 uppercase tracking-wide whitespace-nowrap">Metodología</label>
					<select id="filtroMetodologia" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-xl px-3 py-2 min-h-[40px] focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
						<option value="">Todas</option>
						<option value="ABPC">ABPC</option>
						<option value="STEAM">STEAM</option>
						<option value="ABP">ABP</option>
						<option value="AS">AS</option>
					</select>
				</div>
				<div class="flex items-center gap-1.5">
					<label for="filtroTrimestre" class="text-xs font-semibold text-gray-500 uppercase tracking-wide whitespace-nowrap">Trimestre</label>
					<select id="filtroTrimestre" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-xl px-3 py-2 min-h-[40px] focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
						<option value="">Todos</option>
						<option value="1">1</option>
						<option value="2">2</option>
						<option value="3">3</option>
					</select>
				</div>
				<span id="contadorTexto" class="text-xs text-gray-400 ml-auto"></span>
			</div>

		</div>
	</div>

	<!-- Contenido principal -->
	<main class="max-w-4xl mx-auto px-4 md:px-8 mt-5">
		<!-- Estado de carga / vacío / error -->
		<div id="estado" class="text-center py-16 text-gray-400">
			<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto mb-3 animate-spin text-blue-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
			Cargando planeaciones...
		</div>

		<!-- Grid de proyectos -->
		<div id="grid" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></div>
	</main>

	<!-- Botón flotante: volver a Mis Proyectos -->
	<a href="planeacion.html" class="fixed bottom-5 left-5 z-30 inline-flex items-center gap-2 bg-white border border-gray-300 text-gray-700 font-semibold px-4 py-3 rounded-full shadow-lg hover:bg-gray-50 transition min-h-[44px]">
		<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
		Mis Proyectos
	</a>

	<!-- Modal: vista previa -->
	<div id="modalPreview" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
		<div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden">
			<div class="flex items-start justify-between gap-4 p-5 border-b border-gray-100">
				<h3 id="previewTitulo" class="text-lg font-bold text-gray-800 leading-snug">Vista previa</h3>
				<button id="btnCerrarPreview" type="button" aria-label="Cerrar" class="shrink-0 inline-flex h-9 w-9 items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition">
					<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
				</button>
			</div>
			<div id="previewBody" class="p-5 overflow-y-auto flex flex-col gap-4 text-sm"></div>
			<div class="p-4 border-t border-gray-100 flex justify-end gap-3">
				<button id="btnPreviewCerrarPie" type="button" class="border border-gray-300 text-gray-700 text-sm font-semibold px-4 py-2.5 rounded-xl hover:bg-gray-50 transition min-h-[44px]">Cerrar</button>
				<button id="btnPreviewImportar" type="button" class="bg-emerald-600 text-white text-sm font-bold px-5 py-2.5 rounded-xl hover:bg-emerald-700 transition min-h-[44px]">⬇ Importar a mi cuenta</button>
			</div>
		</div>
	</div>

	<script src="js/supabase.js"></script>
	<script src="js/saas-guard.js"></script>
	<script src="js/navbar.js"></script>
	<script src="js/importador.js"></script>
	<script src="js/marketplace.js"></script>
</body>
</html>
