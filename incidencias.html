<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- App instalable "Jissez MS" (js/app-instalada.js; docs/PWA-MI-SALON.md) -->
	<link rel="manifest" href="/salon.webmanifest">
	<meta name="theme-color" content="#1e3a8a">
	<link rel="apple-touch-icon" href="/iconos/apple-touch-icon-180.png">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Jissez MS">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<script src="js/app-instalada.js"></script>
	<!-- Navegación (js/navbar.js): en el head, para apartar su espacio desde el primer pintado -->
	<script src="js/navbar.js"></script>
	<title>Incidencias — Jissez</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<style>
		/* ── La hoja de la incidencia (pantalla e impresión) ─────────────────── */
		.inc-hoja { background: #fff; color: #1f2937; font-size: 14px; line-height: 1.5; }
		.inc-enc { border-bottom: 2px solid #1e3a8a; padding-bottom: 12px; margin-bottom: 16px; }
		.inc-escuela { font-size: 13px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere; }
		.inc-escuela-vacia { font-weight: 400; text-transform: none; letter-spacing: 0; color: #6b7280; }
		.inc-enc h1 { font-size: 22px; font-weight: 700; color: #1e3a8a; line-height: 1.2; margin-top: 4px; }
		.inc-datos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; margin-top: 12px; }
		.inc-datos div { min-width: 0; }
		.inc-datos dt, .inc-campo dt { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: .03em; }
		.inc-datos dd { font-weight: 600; color: #111827; overflow-wrap: anywhere; }
		@media (min-width: 640px) { .inc-datos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
		.inc-campo { margin-top: 14px; break-inside: avoid; page-break-inside: avoid; }
		.inc-campo dd { color: #111827; overflow-wrap: anywhere; }
		.inc-asunto { font-size: 16px; font-weight: 700; }
		.inc-alumnos { list-style: disc; padding-left: 20px; }
		.inc-seccion { margin-top: 18px; }
		.inc-seccion h2 { font-size: 15px; font-weight: 700; color: #1e3a8a; margin-bottom: 6px; break-after: avoid; page-break-after: avoid; }
		.inc-texto { white-space: pre-wrap; overflow-wrap: anywhere; }
		.inc-renglon { border-bottom: 1px solid #9ca3af; height: 28px; }
		.inc-firmas { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px; margin-top: 48px; break-inside: avoid; page-break-inside: avoid; }
		@media (min-width: 640px) { .inc-firmas { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; } }
		.inc-firma { text-align: center; padding-top: 40px; }
		.inc-firma-linea { border-top: 1px solid #111827; padding-top: 6px; }
		.inc-firma-nombre { font-weight: 600; color: #111827; min-height: 1.5em; overflow-wrap: anywhere; }
		.inc-firma-rol { font-size: 12px; color: #4b5563; }
		.inc-pie { margin-top: 28px; font-size: 11px; color: #6b7280; }

		/* ── Impresión: carta vertical, solo la hoja ─────────────────────────── */
		@page { size: letter portrait; margin: 15mm 15mm 16mm; }
		@media print {
			html, body { background: #fff !important; }
			body { padding: 0 !important; margin: 0 !important; }
			#app-navbar, .no-print, #incPantalla { display: none !important; }
			#incDocumento { display: block !important; max-width: none !important; margin: 0 !important; padding: 0 !important; }
			.inc-marco { border: 0 !important; box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; }
			.inc-hoja { font-size: 11pt; line-height: 1.45; }
			.inc-hoja * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
			.inc-enc h1 { font-size: 17pt; }
			.inc-datos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
			.inc-firmas { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 40px; }
		}
	</style>
</head>
<body class="bg-gray-50 min-h-screen pt-16 px-4 md:px-8 pb-8 text-gray-800">
	<main id="incPantalla" class="max-w-4xl mx-auto flex flex-col gap-4">
		<header class="bg-blue-800 rounded-2xl shadow-md p-6">
			<h1 class="text-2xl md:text-3xl font-bold text-white">Incidencias</h1>
			<p id="incSubtitulo" class="text-blue-100 text-sm md:text-base mt-1">Cargando...</p>
		</header>

		<div id="incMensaje" class="hidden rounded-xl px-4 py-3 text-sm" role="status" aria-live="polite"></div>

		<!-- Faltan datos de la escuela del grupo (van en el encabezado y en la firma del documento) -->
		<div id="incAvisoEscuela" class="hidden rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900 flex flex-col sm:flex-row sm:items-center gap-3">
			<p id="incAvisoEscuelaTexto" class="flex-1"></p>
			<a href="mi-grupo.html" class="shrink-0 inline-flex items-center justify-center min-h-[44px] px-4 rounded-lg border border-amber-300 bg-white font-semibold text-amber-900 hover:bg-amber-100">Completar en Mi grupo</a>
		</div>

		<!-- Formulario (alta y edición) -->
		<section id="incFormulario" class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-6" aria-labelledby="incFormTitulo">
			<h2 id="incFormTitulo" class="text-lg font-bold text-gray-800">Nueva incidencia</h2>
			<p class="text-sm text-gray-500 mt-1">Registra lo que pasó con hechos concretos. No escribas diagnósticos médicos ni datos de salud.</p>
			<form id="incForm" class="mt-4 flex flex-col gap-4" novalidate>
				<div>
					<label for="incAsunto" class="block text-sm font-medium text-gray-800">Asunto</label>
					<input id="incAsunto" type="text" maxlength="150" autocomplete="off" required class="mt-1 block w-full min-h-[44px] px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Ej.: Discusión en el recreo">
				</div>
				<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
					<div>
						<label for="incFecha" class="block text-sm font-medium text-gray-800">Fecha</label>
						<input id="incFecha" type="date" required class="mt-1 block w-full min-h-[44px] px-3 py-2 border border-gray-300 rounded-lg bg-white focus:ring-blue-500 focus:border-blue-500">
					</div>
					<div>
						<label for="incHora" class="block text-sm font-medium text-gray-800">Hora</label>
						<input id="incHora" type="time" class="mt-1 block w-full min-h-[44px] px-3 py-2 border border-gray-300 rounded-lg bg-white focus:ring-blue-500 focus:border-blue-500">
					</div>
				</div>
				<fieldset>
					<legend class="block text-sm font-medium text-gray-800">Alumnos involucrados</legend>
					<p id="incAlumnosAyuda" class="text-xs text-gray-500 mt-0.5">Elige uno o varios alumnos del grupo.</p>
					<div id="incAlumnos" class="mt-2 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2" aria-describedby="incAlumnosAyuda"></div>
					<p id="incAlumnosCuenta" class="text-xs text-gray-600 mt-2" aria-live="polite"></p>
				</fieldset>
				<div>
					<label for="incDescripcion" class="block text-sm font-medium text-gray-800">Descripción</label>
					<textarea id="incDescripcion" rows="5" maxlength="5000" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Qué pasó, dónde y quiénes estaban."></textarea>
				</div>
				<div>
					<label for="incAcuerdos" class="block text-sm font-medium text-gray-800">Acuerdos o compromisos <span class="font-normal text-gray-500">(opcional)</span></label>
					<textarea id="incAcuerdos" rows="3" maxlength="5000" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Si lo dejas vacío, el documento trae renglones para escribirlos a mano."></textarea>
				</div>
				<div id="incFormMensaje" class="hidden rounded-lg px-3 py-2 text-sm" role="alert"></div>
				<div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
					<button id="incCancelarBtn" type="button" class="inline-flex items-center justify-center min-h-[44px] px-5 rounded-lg bg-gray-200 text-gray-800 font-medium hover:bg-gray-300 transition-colors">Cancelar</button>
					<button id="incGuardarBtn" type="submit" class="inline-flex items-center justify-center min-h-[44px] px-5 rounded-lg bg-blue-700 text-white font-semibold hover:bg-blue-800 transition-colors disabled:opacity-60">Guardar incidencia</button>
				</div>
			</form>
		</section>

		<!-- Lista del grupo -->
		<section id="incListaSeccion" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-6" aria-labelledby="incListaTitulo">
			<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
				<div>
					<h2 id="incListaTitulo" class="text-lg font-bold text-gray-800">Registro del grupo</h2>
					<p id="incListaResumen" class="text-sm text-gray-500"></p>
				</div>
				<button id="incNuevaBtn" type="button" disabled class="inline-flex items-center justify-center gap-2 min-h-[44px] px-5 rounded-lg bg-blue-700 text-white font-semibold hover:bg-blue-800 transition-colors disabled:opacity-60">
					<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
					Nueva incidencia
				</button>
			</div>
			<ul id="incLista" class="mt-4 flex flex-col gap-3">
				<li class="rounded-xl border border-dashed border-gray-300 p-4 text-sm text-gray-500">Cargando...</li>
			</ul>
		</section>
	</main>

	<!-- Documento para imprimir (una incidencia) -->
	<section id="incDocumento" class="hidden max-w-4xl mx-auto flex-col gap-4" aria-label="Documento de la incidencia">
		<div class="no-print flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
			<button id="incVolverBtn" type="button" class="inline-flex items-center justify-center gap-2 min-h-[44px] px-4 rounded-lg border border-gray-300 bg-white text-gray-800 font-medium hover:bg-gray-100 transition-colors">
				<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
				Volver a la lista
			</button>
			<button id="incImprimirBtn" type="button" class="inline-flex items-center justify-center gap-2 min-h-[44px] px-5 rounded-lg bg-blue-700 text-white font-semibold hover:bg-blue-800 transition-colors">
				<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
				Imprimir o guardar PDF
			</button>
		</div>
		<div class="inc-marco bg-white rounded-2xl shadow-sm border border-gray-100 p-5 sm:p-8">
			<div id="incHoja"></div>
		</div>
	</section>

	<!-- Confirmar eliminación -->
	<div id="incConfirmar" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="incConfirmarTitulo">
		<div id="incConfirmarFondo" class="absolute inset-0 bg-black/50"></div>
		<div class="relative w-full max-w-md bg-white rounded-2xl shadow-md p-6">
			<h3 id="incConfirmarTitulo" class="text-lg font-bold text-gray-800">¿Eliminar esta incidencia?</h3>
			<p id="incConfirmarTexto" class="mt-3 text-sm text-gray-600 break-words"></p>
			<div class="mt-6 flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
				<button id="incConfirmarNo" type="button" class="inline-flex items-center justify-center min-h-[44px] px-4 rounded-lg bg-gray-200 text-gray-800 font-medium hover:bg-gray-300 transition-colors">Cancelar</button>
				<button id="incConfirmarSi" type="button" class="inline-flex items-center justify-center min-h-[44px] px-4 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700 transition-colors">Sí, eliminar</button>
			</div>
		</div>
	</div>

	<script src="js/supabase.js"></script>
	<script src="js/lectura.js"></script>
	<script src="js/saas-guard.js"></script>
	<script src="js/secciones.js"></script>
	<script src="js/bandeja-salida.js"></script>
	<script src="js/grupo-activo.js"></script>
	<script src="js/leer-todo.js"></script>
	<script src="js/incidencias.js"></script>
</body>
</html>
