<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reporte del alumno — Jissez</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<style>
		/* Los colores (campo, semáforo, banda PPM) son información: se imprimen tal cual */
		#reporte, #reporte * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
		.bloque { break-inside: avoid; page-break-inside: avoid; }
		@media print {
			@page { size: letter portrait; margin: 12mm; }
			#app-navbar, .no-print { display: none !important; }
			body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
			/* Sin flex alrededor del reporte: la paginación de Chrome corta mejor en bloque */
			main > div { display: block !important; max-width: none !important; }
			#reporte { font-size: 12px; }
			#reporte .text-sm { font-size: 12px !important; line-height: 1.45 !important; }
			#reporte .text-xs { font-size: 10.5px !important; line-height: 1.4 !important; }
			#reporte { box-shadow: none !important; border: 0 !important; border-radius: 0 !important; padding: 0 !important; }
			#reporte h2 { break-after: avoid; page-break-after: avoid; }
			#reporte table, #reporte table .text-sm { font-size: 11px !important; }
			#reporte th { padding: 3px 4px !important; font-size: 9.5px !important; }
			#reporte td { padding: 3px 5px !important; }
			#reporte tr { break-inside: avoid; page-break-inside: avoid; }
			.salto-antes { break-before: page; page-break-before: always; }
		}
	</style>
</head>
<body class="bg-gray-50 min-h-screen pt-16 px-4 md:px-8 pb-24 text-gray-800">
	<main>
		<div class="max-w-5xl mx-auto flex flex-col gap-4">
			<header class="no-print bg-blue-800 rounded-2xl shadow-md p-6 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
				<div>
					<h1 class="text-2xl font-bold text-white">Reporte detallado del alumno</h1>
					<p id="raSubtitulo" class="text-blue-100 text-sm mt-1">Cargando...</p>
				</div>
				<a href="reportes.html" class="inline-flex items-center justify-center gap-2 min-h-[44px] px-4 rounded-lg border border-blue-500 text-blue-50 text-sm font-medium hover:bg-blue-700 shrink-0">
					<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
					Reportes
				</a>
			</header>

			<!-- Selección de alumno y trimestre -->
			<section class="no-print bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-5">
				<div class="flex flex-col md:flex-row md:items-end gap-3">
					<label class="flex-1 min-w-0">
						<span class="block text-xs font-semibold text-gray-600 mb-1">Alumno</span>
						<select id="raAlumno" class="w-full min-h-[44px] rounded-lg border border-gray-300 bg-white px-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
							<option value="">Cargando alumnos...</option>
						</select>
					</label>
					<label class="md:w-44">
						<span class="block text-xs font-semibold text-gray-600 mb-1">Trimestre</span>
						<select id="raTrimestre" class="w-full min-h-[44px] rounded-lg border border-gray-300 bg-white px-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
							<option value="1">Trimestre 1</option>
							<option value="2">Trimestre 2</option>
							<option value="3">Trimestre 3</option>
						</select>
					</label>
					<button id="raImprimir" type="button" disabled
						class="inline-flex items-center justify-center gap-2 min-h-[44px] px-5 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed">
						<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7" rx="1"/><path d="M6 18H4a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2"/></svg>
						Imprimir
					</button>
				</div>
			</section>

			<div id="raMensaje" class="no-print hidden rounded-xl px-4 py-3 text-sm"></div>

			<!-- El reporte (lo único que se imprime) -->
			<article id="reporte" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-8">
				<p class="text-sm text-gray-400">Elige un alumno y un trimestre para ver su reporte.</p>
			</article>
		</div>
	</main>

	<script src="js/supabase.js"></script>
	<script src="js/lectura.js"></script>
	<script src="js/saas-guard.js"></script>
	<script src="js/navbar.js"></script>
	<script src="js/grupo-activo.js"></script>
	<script src="js/campos-formativos.js"></script>
	<script src="js/catalogo-habilidades.js"></script>
	<script src="js/alcance-hoy.js"></script>
	<script src="js/motor-calificacion.js"></script>
	<script src="js/textos-boleta.js"></script>
	<script src="js/reporte-datos.js"></script>
	<script src="js/reporte-alumno.js"></script>
</body>
</html>
