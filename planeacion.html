<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Proyectos — Jissez</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen pt-16 px-4 md:px-8 pb-8 text-gray-800">

	<div class="max-w-4xl mx-auto flex flex-col gap-5">

		<!-- Banner proyecto activo -->
		<div id="bannerActivo" class="hidden bg-emerald-50 border border-emerald-200 rounded-2xl px-5 py-4 flex items-center justify-between gap-3">
			<div class="flex items-center gap-3 min-w-0">
				<span class="shrink-0 inline-flex items-center justify-center w-8 h-8 rounded-full bg-emerald-100">
					<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>
				</span>
				<div class="min-w-0">
					<p class="text-xs font-semibold text-emerald-600 uppercase tracking-wide">Proyecto activo</p>
					<p id="bannerActivoTitulo" class="text-sm font-bold text-emerald-800 truncate"></p>
				</div>
			</div>
			<a href="dashboard.html" class="shrink-0 inline-flex items-center gap-1 text-sm font-bold text-emerald-700 hover:text-emerald-900 transition whitespace-nowrap">
				Ver en Dashboard
				<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
			</a>
		</div>

		<!-- Header principal -->
		<header class="bg-blue-900 rounded-2xl p-6 flex flex-col gap-4">
			<div class="flex items-start justify-between gap-4">
				<div>
					<h1 class="text-2xl md:text-3xl font-bold text-white leading-tight">Mis Proyectos</h1>
					<p class="text-blue-200 text-sm mt-1">Gestiona y planea tus proyectos NEM</p>
				</div>
				<div class="shrink-0 flex items-center gap-2">
					<a href="marketplace.html"
					   class="inline-flex items-center gap-2 bg-blue-700 hover:bg-blue-600 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition min-h-[44px]">
						<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-1.5 11a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1L3 9Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
						Marketplace
					</a>
					<a href="crear_proyecto.html"
					   class="inline-flex items-center gap-2 bg-emerald-500 hover:bg-emerald-400 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition min-h-[44px]">
						<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
						Nuevo proyecto
					</a>
				</div>
			</div>

			<!-- Filtros -->
			<div class="flex flex-wrap gap-3">
				<div class="flex items-center gap-2">
					<label for="filtroTrimestre" class="text-xs font-semibold text-blue-200 uppercase tracking-wide whitespace-nowrap">Trimestre</label>
					<select id="filtroTrimestre"
					        class="bg-blue-800 border border-blue-700 text-white text-sm rounded-xl px-3 py-2 min-h-[40px] focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
						<option value="">Todos</option>
						<option value="1">1°</option>
						<option value="2">2°</option>
						<option value="3">3°</option>
					</select>
				</div>
				<div class="flex items-center gap-2">
					<label for="filtroEstado" class="text-xs font-semibold text-blue-200 uppercase tracking-wide whitespace-nowrap">Estado</label>
					<select id="filtroEstado"
					        class="bg-blue-800 border border-blue-700 text-white text-sm rounded-xl px-3 py-2 min-h-[40px] focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
						<option value="">Todos</option>
						<option value="borrador">Listo</option>
						<option value="activo">Activo</option>
						<option value="pausado">Pausado</option>
						<option value="completado">Completado</option>
					</select>
				</div>
				<div id="contadorFiltro" class="hidden items-center ml-auto">
					<span id="contadorTexto" class="text-xs text-blue-300"></span>
				</div>
			</div>
		</header>

		<!-- Contenido principal -->
		<main>
			<!-- Estado de carga / vacío / error -->
			<div id="proyectosEstado" class="text-center py-16 text-gray-400">
				<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto mb-3 animate-spin text-blue-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
				Cargando proyectos...
			</div>

			<!-- Grid de proyectos -->
			<div id="proyectosGrid" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></div>
		</main>

	</div>

	<!-- Modal: iniciar proyecto -->
	<div id="modalInicioProyecto" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
		<div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
			<h3 class="text-lg font-bold text-gray-800 mb-1">Iniciar proyecto</h3>
			<p class="text-sm text-gray-500 mb-4">¿En qué fecha comenzará este proyecto?</p>
			<input type="date" id="fechaInicio"
			       class="w-full rounded-xl border border-gray-300 px-4 py-2.5 text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[44px]" />
			<div class="mt-5 flex justify-end gap-3">
				<button id="btnCancelarModal" type="button"
				        class="border border-gray-300 text-gray-700 text-sm font-semibold px-4 py-2.5 rounded-xl hover:bg-gray-50 transition min-h-[44px]">
					Cancelar
				</button>
				<button id="btnConfirmarInicio" type="button"
				        class="bg-emerald-600 text-white text-sm font-bold px-5 py-2.5 rounded-xl hover:bg-emerald-700 transition min-h-[44px]">
					Iniciar
				</button>
			</div>
		</div>
	</div>

	<script src="js/supabase.js"></script>
	<script src="js/saas-guard.js"></script>
	<script src="js/navbar.js"></script>
	<script src="js/section-shell.js"></script>
	<script src="js/planeacion.js"></script>
</body>
</html>
