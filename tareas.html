<body class="bg-gray-50 min-h-screen pt-16 px-4 md:px-8 pb-8 text-gray-800">
	<div class="max-w-4xl mx-auto flex flex-col gap-6">

		<header class="bg-blue-800 rounded-2xl shadow-md p-6">
			<h1 class="text-2xl md:text-3xl font-bold text-white">Tareas</h1>
			<p class="text-blue-100 text-sm md:text-base mt-1">Tareas asignadas en tus sesiones de clase</p>
		</header>

		<div class="bg-white rounded-2xl shadow-md p-4 flex flex-col sm:flex-row gap-3">
			<select id="filtroProyecto" class="flex-1 px-4 py-3 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
				<option value="">Todos los proyectos</option>
			</select>
			<select id="filtroGrado" class="flex-1 px-4 py-3 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
				<option value="">Todos los grados</option>
				<option value="todos">Para todos</option>
				<option value="3">3°</option>
				<option value="4">4°</option>
				<option value="5">5°</option>
				<option value="6">6°</option>
			</select>
		</div>

		<div id="tareasEstado" class="text-center py-16 text-gray-400 text-lg">Cargando tareas...</div>
		<div id="tareasLista" class="hidden flex flex-col gap-4"></div>

	</div>

	<script src="js/supabase.js"></script>
	<script src="js/saas-guard.js"></script>
	<script src="js/navbar.js"></script>
	<script src="js/section-shell.js"></script>
	<script src="js/tareas.js"></script>
